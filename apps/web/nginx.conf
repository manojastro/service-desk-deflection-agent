server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  location / { try_files $uri /index.html; }
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self' http://localhost:8001; style-src 'self' 'unsafe-inline'; script-src 'self'" always;
}
